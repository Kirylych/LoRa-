<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Коробочка · Панель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14181A;
    --panel: #1D2224;
    --panel-raised: #232829;
    --border: #2A2F31;
    --amber: #FF9500;
    --teal: #3FBFAE;
    --red: #E5484D;
    --text: #EDEAE3;
    --text-muted: #8B9296;
    --text-dim: #5B6265;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-family: 'JetBrains Mono', monospace; }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  .header .sub {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 2px;
  }
  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 10px 6px 8px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 6px var(--teal);
  }

  /* Signal hero */
  .signal-card {
    background: linear-gradient(180deg, var(--panel-raised), var(--panel));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 18px 16px;
    margin-bottom: 12px;
  }
  .signal-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .signal-label {
    color: var(--text-muted);
    font-size: 12px;
    text-transform: none;
  }
  .signal-value {
    font-size: 34px;
    font-weight: 700;
    margin-top: 4px;
    line-height: 1;
  }
  .signal-value span { font-size: 15px; color: var(--text-dim); font-weight: 400; }
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 26px;
  }
  .bars i {
    display: block;
    width: 5px;
    border-radius: 2px;
    background: var(--border);
  }
  .bars i.on { background: var(--amber); }
  .bars i:nth-child(1){ height: 30%; }
  .bars i:nth-child(2){ height: 50%; }
  .bars i:nth-child(3){ height: 70%; }
  .bars i:nth-child(4){ height: 90%; }
  .bars i:nth-child(5){ height: 100%; }
  .signal-foot {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    font-size: 11px;
    color: var(--text-dim);
  }

  /* Grid of readings */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .card .label {
    font-size: 11.5px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .card .value {
    font-size: 22px;
    font-weight: 500;
  }
  .card .value .unit {
    font-size: 13px;
    color: var(--text-dim);
    margin-left: 2px;
  }
  .card.accent .value { color: var(--amber); }
  .card.wide { grid-column: 1 / -1; }
  .card .coords {
    font-size: 15px;
    display: flex;
    justify-content: space-between;
    color: var(--text);
  }
  .card .coords span:last-child { color: var(--text-dim); font-size: 13px; }

  .battery-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 6px;
  }
  .battery-track {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .battery-fill {
    height: 100%;
    background: var(--teal);
    border-radius: 3px;
    transition: width .4s ease;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  button {
    flex: 1;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 13px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    transition: transform .08s ease, background .15s ease;
  }
  button:active { transform: scale(0.97); }
  button.primary {
    background: var(--amber);
    border-color: var(--amber);
    color: #1A1400;
  }

  .footnote {
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    margin-top: 18px;
    line-height: 1.5;
  }

  .flash { animation: flash .5s ease; }
  @keyframes flash {
    0% { background: var(--panel); }
    30% { background: var(--panel-raised); }
    100% { background: var(--panel); }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div>
      <h1>Коробочка</h1>
      <div class="sub" id="lastUpdate">обновлено только что</div>
    </div>
    <div class="status-pill"><span class="dot"></span>онлайн</div>
  </div>

  <div class="signal-card">
    <div class="signal-top">
      <div>
        <div class="signal-label">Сигнал LoRa</div>
        <div class="signal-value num" id="rssiValue">-72<span> дБм</span></div>
      </div>
      <div class="bars" id="bars">
        <i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i>
      </div>
    </div>
    <div class="signal-foot">
      <span>SX1262 · 868 МГц</span>
      <span id="uptime">на связи 2ч 14м</span>
    </div>
  </div>

  <div class="grid">
    <div class="card accent">
      <div class="label">Внутри коробки</div>
      <div class="value num" id="tempIn">24.5<span class="unit">°C</span></div>
    </div>
    <div class="card">
      <div class="label">Снаружи</div>
      <div class="value num" id="tempOut">18.2<span class="unit">°C</span></div>
    </div>

    <div class="card wide">
      <div class="label">Координаты (GPS)</div>
      <div class="coords">
        <span class="num" id="lat">55.7522</span>
        <span class="num" id="lon">37.6156</span>
      </div>
    </div>

    <div class="card wide">
      <div class="label">Батарея</div>
      <div class="battery-row">
        <div class="battery-track"><div class="battery-fill" id="battFill" style="width:87%"></div></div>
        <span class="num" id="battValue" style="font-size:13px;">87%</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="refreshBtn">Обновить показания</button>
    <button class="primary" id="pingBtn">Проверить связь</button>
  </div>

  <div class="footnote">
    Тестовые данные. Реальные показания появятся<br>после подключения коробочки и приёмника.
  </div>

</div>

<script>
  // ЗАГЛУШКА: сейчас данные генерируются случайно на телефоне.
  // Позже здесь будет обычный fetch() к домашнему модулю/боту,
  // который вернёт реальные значения с датчиков, например:
  //
  // fetch('https://ТВОЙ-АДРЕС/last-reading')
  //   .then(r => r.json())
  //   .then(data => applyReading(data));

  function randomReading() {
    return {
      tempIn: (22 + Math.random() * 5).toFixed(1),
      tempOut: (14 + Math.random() * 8).toFixed(1),
      rssi: -60 - Math.round(Math.random() * 30),
      battery: 60 + Math.round(Math.random() * 39),
      lat: (55.75 + (Math.random() - 0.5) * 0.01).toFixed(4),
      lon: (37.61 + (Math.random() - 0.5) * 0.01).toFixed(4),
    };
  }

  function applyReading(data) {
    document.getElementById('tempIn').innerHTML = data.tempIn + '<span class="unit">°C</span>';
    document.getElementById('tempOut').innerHTML = data.tempOut + '<span class="unit">°C</span>';
    document.getElementById('rssiValue').innerHTML = data.rssi + '<span> дБм</span>';
    document.getElementById('battValue').textContent = data.battery + '%';
    document.getElementById('battFill').style.width = data.battery + '%';
    document.getElementById('lat').textContent = data.lat;
    document.getElementById('lon').textContent = data.lon;
    document.getElementById('lastUpdate').textContent = 'обновлено только что';

    // Полоски сигнала: чем ближе rssi к 0, тем больше делений горит
    const bars = document.querySelectorAll('#bars i');
    const level = data.rssi > -70 ? 5 : data.rssi > -85 ? 4 : data.rssi > -95 ? 3 : data.rssi > -105 ? 2 : 1;
    bars.forEach((b, i) => b.classList.toggle('on', i < level));

    const card = document.querySelector('.signal-card');
    card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
  }

  document.getElementById('refreshBtn').addEventListener('click', () => {
    applyReading(randomReading());
  });

  document.getElementById('pingBtn').addEventListener('click', () => {
    const pill = document.querySelector('.status-pill');
    pill.style.opacity = '0.4';
    setTimeout(() => { pill.style.opacity = '1'; }, 250);
  });

  // Если страница открыта внутри Telegram — сообщаем клиенту, что готовы
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }
</script>
</body>
</html>
